spring:
  application:
    name: invernadero-automatizacion

  datasource:
    url: jdbc:postgresql://localhost:5432/invernadero
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:900000}
  oauth2:
    auto-register: ${APP_OAUTH2_AUTO_REGISTER:true}
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/auth/callback}
  codegen:
    examples-path: ${CODEGEN_EXAMPLES_PATH:../tools/codegen/examples}
