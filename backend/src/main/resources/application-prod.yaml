spring:
  application:
    name: invernadero-automatizacion

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:900000}
  oauth2:
    auto-register: ${APP_OAUTH2_AUTO_REGISTER:true}
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

